version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./sovereign.db:/app/sovereign.db
      - ./uploads:/app/uploads
      - ./local_outputs:/app/local_outputs
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
