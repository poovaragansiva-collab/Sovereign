services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sovereign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sovereign_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sovereign_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sovereign} -d ${POSTGRES_DB:-sovereign_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./uploads:/app/uploads
      - ./local_outputs:/app/local_outputs
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sovereign}:${POSTGRES_PASSWORD:-sovereign_pass}@postgres:5432/${POSTGRES_DB:-sovereign_db}
      - JWT_SECRET=${JWT_SECRET:-super-secret-key-change-in-production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - 'SOVEREIGN_MODELS=[{"name":"gemma3:4b", "type":"general"}, {"name":"qwen3:4b", "type":"reasoning"}, {"name":"qwen2.5-coder:3b", "type":"coding"}]'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
