
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./sovereign.db:/app/sovereign.db
      - ./uploads:/app/uploads
      - ./local_outputs:/app/local_outputs
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - 'SOVEREIGN_MODELS=[{"name":"gemma3:4b", "type":"general"}, {"name":"qwen3:4b", "type":"reasoning"}, {"name":"qwen2.5-coder:3b", "type":"coding"}]'

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
